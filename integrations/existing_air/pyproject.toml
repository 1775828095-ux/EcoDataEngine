[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecodata-existing-air-converters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["xarray>=2024.1,<2027", "h5netcdf>=1.3,<2", "h5py>=3.10,<4", "scipy>=1.12,<2"]

[project.entry-points."ecodata.model_converters"]
wrf = "existing_air_converters:wrf"
camx = "existing_air_converters:camx"
cmaq = "existing_air_converters:cmaq"
calpuff = "existing_air_converters:calpuff"

[tool.setuptools]
packages = ["existing_air_converters"]

[tool.setuptools.package-data]
existing_air_converters = ["bindings.json", "cmaq_reviewed_project.json"]
