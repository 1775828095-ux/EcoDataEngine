[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecodata-engine"
version = "1.0.1.dev1+source.20261006.r12"
description = "Unified, semantics-aware environmental data processing engine"
requires-python = ">=3.11"
dependencies = [
  "f90nml==1.5.0",
  "h5netcdf>=1.3,<2",
  "h5py>=3.10,<4",
  "cvxpy>=1.7,<2",
  "geopandas>=1.0,<2",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "osqp>=1,<2",
  "pandas>=2.1,<4",
  "python-dateutil>=2.9,<3",
  "pillow>=10,<13",
  "openpyxl>=3.1,<4",
  "markdown-it-py>=3,<5",
  "python-docx>=1.2,<2",
  "pypdf>=5,<8",
  "pypdfium2>=4,<6",
  "pyarrow>=15,<26",
  "rasterio>=1.4,<2",
  "pyshp>=2.3,<3",
  "py7zr==1.1.4",
  "paramiko>=5.1,<6",
  "psutil>=7,<8",
  "scipy>=1.12,<2",
  "ruptures>=1.1.10,<2",
  "threadpoolctl>=3,<4",
  "streamlit>=1.50,<2",
  "xarray>=2024.1,<2027",
  "xarray-regrid>=0.4.2,<0.5",
  "cf-xarray>=0.11,<0.12",
  "pint-xarray>=0.6,<0.7",
  "gstools>=1.7,<1.8",
  "compliance-checker>=6.1,<7",
  "xskillscore>=0.0.29,<0.1",
  "dataretrieval>=1.4,<2",
  "flopy>=3.11,<4",
  "ish-parser==0.0.25",
  "pytz>=2026.1,<2027",
]

[project.optional-dependencies]
wrfda-setup = ["pycdlib==1.22.0"]
test = ["pytest>=8,<10"]
ml = ["torch>=2.5,<3", "neuraloperator>=1.0,<2", "focal-frequency-loss==0.3.0"]
galileo = ["einops>=0.7,<0.9"] # Official Galileo single-file encoder dependency.
verification = ["PseudoNetCDF==3.4.1", "geographiclib==2.1", "SALib==1.5.2", "scores==2.7.0"] # Independent diagnostics; not production writers.
pnc = ["PseudoNetCDF==3.5.0"] # Optional reader, bundled and tested in round-one portable.
xesmf = ["xesmf>=0.9,<0.10"] # ESMPy must be installed separately.
composition-search = ["alns==7.0.0", "pymoo==0.6.2"] # Optional native optimisers; no GOLEM dependency in optimiser adapter.
environment-algorithms = ["pykrige==1.7.3", "metpy==1.7.1", "xsdba==0.5.0"]
raster-complements = ["scikit-image==0.26.0", "PyWavelets==1.10.0"]
advanced-complements = ["opencv-contrib-python-headless==5.0.0.93", "dask[array]==2026.8.0", "zarr==3.4.1"]
climate-statistics = ["xclim==0.59.1", "yamale==6.1.0"]
terrain-components = ["scikit-learn==1.9.1", "netCDF4>=1.6,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecodata = ["models/profiles/*.json", "models/adapters/*.json", "io/*.json", "algorithms/*.json"]
